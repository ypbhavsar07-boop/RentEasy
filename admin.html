
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RentEasy - Admin Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f7f5ff;
            color: #171536;
        }

        header {
            background: #5B2CC9;
            color: white;
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        header h1 {
            font-size: 25px;
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .actions a,
        .actions button {
            background: white;
            color: #5B2CC9;
            padding: 11px 17px;
            border: none;
            border-radius: 7px;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
        }

        main {
            padding: 35px 5%;
        }

        .welcome {
            margin-bottom: 25px;
        }

        .welcome h2 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .welcome p {
            color: #777;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(2, minmax(180px, 240px));
            gap: 20px;
            margin-bottom: 35px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(40, 20, 90, 0.08);
        }

        .stat-card h3 {
            color: #5B2CC9;
            font-size: 32px;
            margin-bottom: 8px;
        }

        .stat-card p {
            color: #777;
        }

        .bookings-box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(40, 20, 90, 0.08);
        }

        .bookings-box h2 {
            margin-bottom: 20px;
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            min-width: 1000px;
            border-collapse: collapse;
        }

        th, td {
            padding: 15px 12px;
            text-align: center;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }

        th {
            background: #5B2CC9;
            color: white;
            white-space: nowrap;
        }

        tbody tr:nth-child(even) {
            background: #faf9ff;
        }

        .status {
            color: #16834a;
            font-weight: bold;
        }

        @media(max-width: 600px) {
            main {
                padding: 25px 4%;
            }

            .stats {
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }

            .bookings-box {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>RentEasy Admin</h1>

    <div class="actions">
        <a href="/">Visit Website</a>

        <form action="/logout" method="post">
            <button type="submit">Logout</button>
        </form>
    </div>
</header>

<main>

    <section class="welcome">
        <h2>Admin Dashboard</h2>
        <p>Manage and monitor all customer bookings.</p>
    </section>

    <section class="stats">
        <div class="stat-card">
            <h3 id="totalBookings">0</h3>
            <p>Total Bookings</p>
        </div>

        <div class="stat-card">
            <h3 id="confirmedBookings">0</h3>
            <p>Confirmed Bookings</p>
        </div>
    </section>

    <section class="bookings-box">
        <h2>Customer Bookings</h2>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Booking ID</th>
                        <th>Customer Name</th>
                        <th>Email</th>
                        <th>Product ID</th>
                        <th>Start Date</th>
                        <th>End Date</th>
                        <th>Total Price</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody id="adminBookingList">
                    <tr>
                        <td colspan="8">Loading bookings...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>

</main>

<script>
async function loadAdminBookings() {
    const bookingList = document.getElementById("adminBookingList");

    try {
        const response = await fetch("/api/bookings");

        if (!response.ok) {
            throw new Error("Unable to load bookings. Status: " + response.status);
        }

        const bookings = await response.json();

        document.getElementById("totalBookings").textContent =
            bookings.length;

        document.getElementById("confirmedBookings").textContent =
            bookings.filter(b => b.status === "CONFIRMED").length;

        if (bookings.length === 0) {
            bookingList.innerHTML =
                '<tr><td colspan="8">No bookings found.</td></tr>';
            return;
        }

        bookingList.innerHTML = bookings.map(booking => `
            <tr>
                <td>${booking.id}</td>
                <td>${booking.customerName}</td>
                <td>${booking.customerEmail}</td>
                <td>${booking.productId}</td>
                <td>${booking.startDate}</td>
                <td>${booking.endDate}</td>
                <td>₹${booking.totalPrice}</td>
                <td class="status">${booking.status}</td>
            </tr>
        `).join("");

    } catch (error) {
        bookingList.innerHTML =
            '<tr><td colspan="8">Unable to load bookings.</td></tr>';

        console.error("Admin booking error:", error);
    }
}

loadAdminBookings();
</script>

</body>
</html>
